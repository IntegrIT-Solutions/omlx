name: Validate DFlash review corrections
on:
  push:
    branches: [automation/dflash-review-20260913]
    paths: ['.github/review-fix/**', 'tests/test_dflash_sdpa256_*', '.github/workflows/dflash-review-fix.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply only hash-verified source edits
        run: python .github/review-fix/repair.py && python .github/review-fix/repair2.py
      - name: Prepare test tooling
        run: python -m pip install pytest pytest-asyncio black==24.10.0
      - name: Format new tests and check syntax
        run: |
          python -m black tests/test_dflash_sdpa256_load_order.py tests/test_dflash_sdpa256_lifecycle.py tests/test_dflash_sdpa256_numerics.py
          python -m compileall -q omlx/patches tests/test_dflash_sdpa256_load_order.py tests/test_dflash_sdpa256_lifecycle.py tests/test_dflash_sdpa256_numerics.py
          git diff --check
      - name: Host-only exact-source regression tests (not native)
        run: python .github/review-fix/run_host_tests.py
      - name: Publish tested candidate on preparation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omlx/patches/qwen35_fa256_attention.py tests/test_dflash_sdpa256.py omlx/patches/sdpa256_attention.py omlx/patches/turboquant_attention.py docs/dflash-sdpa256-validation.md tests/test_dflash_sdpa256_load_order.py tests/test_dflash_sdpa256_lifecycle.py tests/test_dflash_sdpa256_numerics.py
          git diff --cached --stat
          git commit -m 'fix(dflash): reconcile retained SDPA aliases across wrapper installation'
          git push origin HEAD:automation/dflash-review-20260913
          git rev-parse HEAD
  native:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply same reviewed source edits
        run: python .github/review-fix/repair.py && python .github/review-fix/repair2.py
      - name: Install pinned project dependencies (same path as upstream CI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mcp]'
          python -m pip install pytest pytest-asyncio
      - name: Native backend evidence
        run: python -c "import platform, mlx.core as mx; print(platform.platform(), platform.machine()); print('Metal available:', mx.metal.is_available()); print('Default device:', mx.default_device())"
      - name: Native new tests and related regression suites
        run: |
          python -m pytest -q tests/test_dflash_sdpa256.py tests/test_dflash_sdpa256_load_order.py tests/test_dflash_sdpa256_lifecycle.py tests/test_dflash_sdpa256_numerics.py tests/test_sdpa256_attention.py tests/test_dflash_prefill_memory_guard.py tests/test_dflash_engine.py tests/test_process_memory_enforcer.py
